name: Trading Platform CI

on:
  pull_request:
    paths:
      - "agent/src/trading_platform/**"
      - "agent/src/api/trading_platform_routes.py"
      - "agent/src/options_market/personal.py"
      - "agent/src/options_market/personal_service.py"
      - "agent/src/options_market/catalyst.py"
      - "agent/src/options_market/catalyst_store.py"
      - "agent/src/options_market/alpaca_news.py"
      - "agent/api_server.py"
      - "agent/tests/test_trading_platform_*.py"
      - "agent/tests/test_options_market_personal*.py"
      - "agent/tests/test_options_market_catalyst*.py"
      - "agent/tests/test_options_market_alpaca_news.py"
      - "frontend/src/lib/tradingDesk.ts"
      - "frontend/src/pages/TradingDesk.tsx"
      - "frontend/src/router.tsx"
      - "frontend/src/components/layout/Layout.tsx"
      - "frontend/tsconfig.json"
      - "scripts/publish_trading_desk.py"
      - "scripts/generate_us_market_calendar.py"
      - "scripts/refresh_us_universe.py"
      - "scripts/refresh_focused_options.py"
      - "scripts/refresh_catalysts.py"
      - "scripts/backfill_us_market_data.py"
      - ".github/workflows/trading-platform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install targeted dependencies
        run: python -m pip install --upgrade pip pytest pydantic duckdb numpy pandas requests "exchange_calendars>=4.13.2,<5"
      - name: Compile platform modules, data/catalyst CLIs and API assembler
        run: |
          python -m compileall -q agent/src/trading_platform agent/src/api/trading_platform_routes.py agent/src/options_market/catalyst_store.py agent/src/options_market/alpaca_news.py
          python -m py_compile agent/api_server.py scripts/publish_trading_desk.py scripts/generate_us_market_calendar.py scripts/refresh_us_universe.py scripts/refresh_focused_options.py scripts/refresh_catalysts.py scripts/backfill_us_market_data.py
      - name: Run platform, catalyst and personal-decision tests
        env:
          PYTHONPATH: agent
        run: pytest agent/tests/test_trading_platform_*.py agent/tests/test_options_market_personal.py agent/tests/test_options_market_personal_data_quality.py agent/tests/test_options_market_catalyst*.py agent/tests/test_options_market_alpaca_news.py -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
