name: Trading Platform CI

on:
  pull_request:
    paths:
      - "agent/src/trading_platform/**"
      - "agent/src/api/trading_platform_routes.py"
      - "agent/src/options_market/**"
      - "agent/api_server.py"
      - "agent/tests/test_trading_platform_*.py"
      - "agent/tests/test_options_market_personal*.py"
      - "agent/tests/test_options_market_pipeline.py"
      - "agent/tests/test_options_market_experiment*.py"
      - "agent/tests/test_options_market_catalyst*.py"
      - "agent/tests/test_options_market_alpaca_news.py"
      - "agent/tests/test_options_market_alpaca_surface.py"
      - "agent/tests/test_options_market_surface*.py"
      - "agent/tests/test_options_market_paper_rest.py"
      - "frontend/src/lib/tradingDesk.ts"
      - "frontend/src/pages/TradingDesk.tsx"
      - "frontend/src/router.tsx"
      - "frontend/src/components/layout/Layout.tsx"
      - "frontend/tsconfig.json"
      - "scripts/publish_trading_desk.py"
      - "scripts/generate_us_market_calendar.py"
      - "scripts/refresh_us_universe.py"
      - "scripts/refresh_focused_options.py"
      - "scripts/refresh_catalysts.py"
      - "scripts/backfill_us_market_data.py"
      - "scripts/run_options_historical_experiment.py"
      - "scripts/assess_account_risk.py"
      - "scripts/run_personal_options_assistant.py"
      - "scripts/run_paper_option_lifecycle.py"
      - "scripts/evaluate_paper_exits.py"
      - "scripts/checkpoint_candidate_outcomes.py"
      - "scripts/refresh_paper_exit_state.py"
      - "scripts/run_trading_platform_lifecycle_worker.py"
      - "scripts/start_trading_platform.py"
      - "scripts/trading_platform_preflight.py"
      - "agent/requirements-market-calendar.txt"
      - "requirements-market-calendar-lock.txt"
      - "Dockerfile"
      - ".github/workflows/trading-platform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install targeted dependencies
        run: |
          python -m pip install --upgrade pip pytest pydantic duckdb numpy pandas scipy requests
          python -m pip install --require-hashes --no-deps -r requirements-market-calendar-lock.txt
          python -c "import exchange_calendars as xcals; assert 'XNYS' in xcals.get_calendar_names()"
      - name: Compile platform, options-market modules, CLIs and API assembler
        run: |
          python -m compileall -q agent/src/trading_platform agent/src/options_market agent/src/api/trading_platform_routes.py
          python -m py_compile agent/api_server.py scripts/publish_trading_desk.py scripts/generate_us_market_calendar.py scripts/refresh_us_universe.py scripts/refresh_focused_options.py scripts/refresh_catalysts.py scripts/backfill_us_market_data.py scripts/run_options_historical_experiment.py scripts/assess_account_risk.py scripts/run_personal_options_assistant.py scripts/run_paper_option_lifecycle.py scripts/evaluate_paper_exits.py scripts/checkpoint_candidate_outcomes.py scripts/refresh_paper_exit_state.py scripts/run_trading_platform_lifecycle_worker.py scripts/start_trading_platform.py scripts/trading_platform_preflight.py
      - name: Run platform, experiment, surface, ranking, catalyst, paper and personal-decision tests
        env:
          PYTHONPATH: agent
        run: pytest agent/tests/test_trading_platform_*.py agent/tests/test_options_market_personal.py agent/tests/test_options_market_personal_data_quality.py agent/tests/test_options_market_pipeline.py agent/tests/test_options_market_experiment*.py agent/tests/test_options_market_surface*.py agent/tests/test_options_market_alpaca_surface.py agent/tests/test_options_market_catalyst*.py agent/tests/test_options_market_alpaca_news.py agent/tests/test_options_market_paper_rest.py -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
